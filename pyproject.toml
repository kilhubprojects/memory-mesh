[project]
name = "memorymesh-mcp"
version = "0.8.0"
description = "Local MCP hub for personal data — private, cross-platform, agent-ready."
readme = "README.md"
license = "MIT"
authors = [
    {name = "Carlos Coelho", email = "kilhub.projects@gmail.com"},
]
keywords = ["mcp", "embeddings", "search", "rag", "personal-data", "local-first"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Indexing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "typer>=0.12",
    "loguru>=0.7",
    "rich>=13.0",
    "chromadb>=0.5",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "markdown-it-py>=3.0",
    "tree-sitter>=0.21,<0.22",
    "tree-sitter-languages>=1.10",
    "sentence-transformers>=2.7",
    "rank-bm25>=0.2",
    "watchdog>=4.0",
    "mcp>=1.0",
    "uvicorn>=0.29",
    "starlette>=0.37",
    "psutil>=5.9",
    "icalendar>=5.0",
    "fastapi>=0.111",
    "cryptography>=42.0",
]

[project.optional-dependencies]
rss = ["feedparser>=6.0"]
multimodal = ["open-clip-torch>=2.24", "Pillow>=10.0", "faster-whisper>=1.0"]

[project.urls]
Homepage = "https://github.com/kilhubprojects/memory-mesh"
Repository = "https://github.com/kilhubprojects/memory-mesh"
Issues = "https://github.com/kilhubprojects/memory-mesh/issues"
Changelog = "https://github.com/kilhubprojects/memory-mesh/blob/main/CHANGELOG.md"

[project.scripts]
memorymesh = "memorymesh.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.0",
    "fpdf2>=2.7",
    "types-PyYAML>=6.0",
    "types-psutil>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memorymesh"]

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "LICENSE",
    "README.md",
    "CHANGELOG.md",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = [
    "B008",   # function call in default argument — standard Typer pattern
]

[tool.ruff.lint.per-file-ignores]
# Benchmark scripts manipulate sys.path before local imports (expected pattern).
"benchmarks/*.py" = ["E402"]
# Dashboard contains CSS/HTML string literals where long lines are unavoidable.
"src/memorymesh/server/dashboard.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["memorymesh"]
split-on-trailing-comma = true

[tool.pytest.ini_options]
markers = [
    "slow: tests that load a real ML model (deselect with -m 'not slow')",
]

[tool.mypy]
python_version = "3.11"
disable_error_code = ["import-untyped", "import"]
